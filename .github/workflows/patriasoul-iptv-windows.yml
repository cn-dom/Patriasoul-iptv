name: PatriaSoul IPTV Windows build

on:
  push:
    branches:
      - feature/patriasoul-iptv-desktop
    paths:
      - "patriasoul-iptv/**"
      - ".github/workflows/patriasoul-iptv-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: patriasoul-iptv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build Windows installer and portable app
        run: npm run dist:win
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PatriaSoul-IPTV-Windows
          path: |
            patriasoul-iptv/release/*.exe
            patriasoul-iptv/release/*.blockmap
            patriasoul-iptv/release/latest.yml
          if-no-files-found: error
          retention-days: 14
